<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" type="text/css"
        href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css" />
    <link rel="stylesheet" type="text/css"
        href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <link rel="stylesheet" href="/CSS/login.css">
    <link rel="icon" href="/images/icon.png" type="image/x-icon">
    <title>Login | MaintainIQ</title>
</head>

<body>

    <div class="toast">
        <i class="fa-solid fa-circle-xmark" id="toast-icon"></i>
        <p class="toast-message">Message</p>
    </div>

    <div class="login-container">
        
        <div class="role-selection-wrapper">
            <div class="role-toggle-container">
                <p class="role-option active">Admin</p>
                <p class="role-option">Technician</p>
            </div>
        </div>

        <div class="login-card">

            <div class="login-header">
                <h2>Welcome Back!</h2>
                <p>Please enter your credentials to sign in.</p>
            </div>

            <form class="login-form">
                <div class="input-group">
                    <label>Email Address <span>*</span></label>
                    <div class="input-wrapper">
                        <input type="text" placeholder="Enter your email" id="emailInput">
                    </div>
                </div>

                <div class="input-group">
                    <label>Password <span>*</span></label>
                    <div class="input-wrapper">
                        <input type="password" placeholder="Enter your password" id="passwordInput">
                        <i class="ph ph-eye" id="eye-icon"></i>
                    </div>
                </div>

                <button type="submit" class="login-btn">Sign In</button>
            </form>
        </div>
    </div>

    <script src="/JS/login.js"></script>
</body>

</html>
